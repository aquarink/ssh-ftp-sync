# Ant Tech Async API: allow RESTful host update/identity assignment methods.
# Keep CRS active for request body inspection; only remove the method policy
# false-positive for authenticated host-management endpoints.
SecRule REQUEST_URI "@rx ^/api/hosts/[0-9a-fA-F-]+(?:/identity)?$" \
    "id:100010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=911100"
