# Ant Tech Async API: allow auth endpoints that carry Turnstile and password bodies.
# Keep CRS active globally; only remove the method-policy false positive for these
# authenticated JSON endpoints so login/register can reach the Node API.
SecRule REQUEST_URI "@rx ^/api/auth/(?:login|register)$" \
    "id:100012,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=911100"
