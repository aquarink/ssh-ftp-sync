# Ant Tech Async API: allow admin approval review method.
# Keep CRS active for request body inspection; only remove the generic method
# policy false-positive for this REST endpoint.
SecRule REQUEST_URI "@rx ^/api/admin/users/[0-9a-fA-F-]+/approval$" \
    "id:100011,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=911100"
